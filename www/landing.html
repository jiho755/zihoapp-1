<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe4">
<title>생명나무</title>
<style>
:root{--bg:#f4efe4;--ink:#2d3b30;--sub:#6a7667;--accent:#3f6149;--line:#e6dfc8;--leaf:#6f9a6b;--leaf2:#8fb487}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:1rem/1.7 "Noto Sans KR",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;overflow:hidden}
.stage{display:flex;flex-direction:column;align-items:center;gap:1.4rem;padding:2rem 1.2rem;text-align:center}
.seedwrap{position:relative;width:min(62vw,15rem);aspect-ratio:1}
svg{width:100%;height:100%;overflow:visible;display:block}
.glow{transform-origin:100px 118px;animation:glow 3.6s ease-in-out infinite}
.ring{transform-origin:100px 118px;fill:none;stroke:var(--accent);stroke-width:1.4;opacity:0;animation:ring 3.6s ease-out infinite}
.ring.r2{animation-delay:1.2s}.ring.r3{animation-delay:2.4s}
.float{animation:float 4.2s ease-in-out infinite}
.seed{transform-origin:100px 118px;animation:sway 4.2s ease-in-out infinite}
.leaf{transform-box:fill-box;transform-origin:50% 100%;opacity:0}
.l1{animation:grow1 7s ease-in-out infinite}
.l2{animation:grow2 7s ease-in-out infinite}
.stem{transform-box:fill-box;transform-origin:50% 100%;animation:stem 7s ease-in-out infinite}
.sp{fill:var(--accent);opacity:0;animation:rise 5.6s ease-in infinite}
.sp.s2{animation-delay:1.9s}.sp.s3{animation-delay:3.7s}
h1{margin:0;font:700 clamp(2rem,9vw,2.8rem)/1.2 "Noto Serif KR","Noto Sans KR",serif;letter-spacing:.18em;padding-left:.18em;color:var(--ink);opacity:0;animation:fadeUp 1.4s .4s ease-out forwards}
.sub{margin:0;color:var(--sub);font-size:.95rem;opacity:0;animation:fadeUp 1.4s 1s ease-out forwards}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes glow{0%,100%{transform:scale(.88);opacity:.55}50%{transform:scale(1.12);opacity:.95}}
@keyframes ring{0%{transform:scale(.5);opacity:0}15%{opacity:.35}100%{transform:scale(1.45);opacity:0}}
@keyframes stem{0%,12%{transform:scaleY(0)}45%,80%{transform:scaleY(1)}95%,100%{transform:scaleY(0)}}
@keyframes grow1{0%,30%{opacity:0;transform:scale(0) rotate(-20deg)}50%,80%{opacity:1;transform:scale(1) rotate(0)}95%,100%{opacity:0;transform:scale(0) rotate(-20deg)}}
@keyframes grow2{0%,36%{opacity:0;transform:scale(0) rotate(20deg)}56%,80%{opacity:1;transform:scale(1) rotate(0)}95%,100%{opacity:0;transform:scale(0) rotate(20deg)}}
@keyframes rise{0%{opacity:0;transform:translateY(20px)}20%{opacity:.8}100%{opacity:0;transform:translateY(-70px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}.leaf,.stem{opacity:1;transform:none}}
</style>
</head>
<body>
<main class="stage">
  <div class="seedwrap" role="img" aria-label="움직이는 생명나무 씨앗">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="g" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#cfe0b8" stop-opacity=".95"/>
          <stop offset="1" stop-color="#cfe0b8" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="sd" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8a6a45"/>
          <stop offset="1" stop-color="#5b4128"/>
        </linearGradient>
      </defs>
      <circle class="ring" cx="100" cy="118" r="52"/>
      <circle class="ring r2" cx="100" cy="118" r="52"/>
      <circle class="ring r3" cx="100" cy="118" r="52"/>
      <circle class="glow" cx="100" cy="118" r="62" fill="url(#g)"/>
      <g class="float">
        <g class="seed">
          <!-- 싹 -->
          <rect class="stem" x="98.6" y="62" width="2.8" height="30" rx="1.4" fill="var(--accent)"/>
          <path class="leaf l1" d="M100 70 C84 66 72 54 70 42 C84 42 97 52 100 70Z" fill="var(--leaf)"/>
          <path class="leaf l2" d="M100 64 C116 60 128 48 130 36 C116 36 103 46 100 64Z" fill="var(--leaf2)"/>
          <!-- 씨앗 -->
          <path d="M100 86 C128 96 140 122 128 146 C118 164 88 166 76 148 C62 126 76 94 100 86Z" fill="url(#sd)"/>
          <path d="M100 92 C112 112 112 138 100 160" fill="none" stroke="#f0e3c8" stroke-width="2.2" stroke-linecap="round" opacity=".55"/>
          <ellipse cx="88" cy="112" rx="5" ry="10" fill="#fff" opacity=".22" transform="rotate(18 88 112)"/>
        </g>
      </g>
      <circle class="sp" cx="62" cy="120" r="2.6"/>
      <circle class="sp s2" cx="140" cy="130" r="2.2"/>
      <circle class="sp s3" cx="108" cy="150" r="1.8"/>
    </svg>
  </div>
  <h1>생명나무</h1>
  <p class="sub">말씀 묵상 노트</p>
</main>
</body>
</html>
