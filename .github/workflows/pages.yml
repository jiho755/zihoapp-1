name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1) 웹 파일을 묶어서 올리기
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 빌드 번호 삽입
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7} ($(TZ=Asia/Seoul date +'%m-%d %H:%M'))/" www/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  # 2) 배포 (올린 파일을 GitHub가 바로 못 찾는 경우가 있어 잠시 기다렸다가, 실패하면 최대 2번 더 시도)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d3.outputs.page_url || steps.d2.outputs.page_url || steps.d1.outputs.page_url }}
    steps:
      - name: 업로드 반영 대기
        run: sleep 15
      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: 재시도 전 대기
        if: steps.d1.outcome == 'failure'
        run: sleep 30
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: 재시도 전 대기
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 60
      - id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
