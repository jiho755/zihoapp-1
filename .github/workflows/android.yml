name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Sync web files into the Android project
        run: npx cap sync android

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk saengmyeongnamu-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: saengmyeongnamu-debug-apk
          path: saengmyeongnamu-debug.apk

      - name: Publish latest APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest saengmyeongnamu-debug.apk \
            --title "최신 APK (생명나무)" \
            --notes "커밋 ${GITHUB_SHA::7} 로 만든 테스트용 APK입니다." \
            --prerelease
